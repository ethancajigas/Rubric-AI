<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubric AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e9e9e9;
      flex-direction: column;
      min-height: 100vh;
      gap: 600px;
    }


    .header {
        display: flex;
        align-items: center;
        justify-content: space-between; /* This will push logo to left, buttons to right */
        background-color: #383838;
        padding: 10px 20px;
        border-bottom: 2px solid #ddd;
        width: 100%;
        position: fixed;
        z-index: 1000;
        top: 0;
    }

    .header .header-buttons {
        display: flex;
        align-items: center;
        gap: 20px; /* Space between buttons */
        margin-right: 7%;
        position: static;
        right: auto;
    }

    .header .header-button {
        background-color: transparent;
        border: none;
        cursor: pointer;
        padding: 5px 10px;
        transition: color 0.5s ease;
        font-family: "Montserrat", sans-serif;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
     }
     
    .header .header-button:hover {
        color: #5bb0d4;
    }

    .header .logo-container {
      display: flex;
      align-items: center;
      margin-left: 7%;
    }

    .header .logo-container img {
      height: 60px;
      margin-right: 5px;
    }

    .header .logo-container .title {
      font-family: "Montserrat", cursive, sans-serif;
      font-size: 24px;
      color: #ffffff;
    }

    .footer {
      background-color: #383838;
      color: #ffffff;
      padding: 20px 0; /* Top and bottom padding, no horizontal padding */
      width: 100vw; /* Full viewport width */
      position: relative;
      bottom: 0;
      left: 0;
      margin-top: auto;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px; /* Keeps the content centered within the footer */
      margin: 0 auto; /* Centers the content horizontally */
      padding: 0 20px; /* Optional: Adds spacing inside the content */
    }

    .footer-left {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
    }

    .footer-right {
      display: flex;
      gap: 20px;
    }

    .footer-right a {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.5s ease;
    }

    .footer-right a:hover {
      color: #5bb0d4;
    }

    .container {
      width: 1200px;
      max-width: 90%;
      height: 600px;
      max-height: 90%;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
     /* Media Queries for Smaller Screens */
    @media (max-width: 768px) {
        .container {
            width: 90%; /* Adjust width for tablet and smaller devices */
            height: 600px; /* Reduce height for smaller screens */
        }
    }

    @media (max-width: 480px) {
        .container {
            width: 90%; /* Keep width as a percentage for very small screens */
            height: 500px; /* Further reduce height for small screens */
        }
    }

    .container-header {
      display: flex;
      align-items: center;
      background-color: #f5f5f5;
      padding: 10px 20px;
      border-bottom: 2px solid #ddd;
    }

    .container .header-button {
      background-color: transparent;
      color: #000;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 5px 10px;
      transition: color 0.5s ease;
      font-family: "Montserrat", sans-serif;
      text-decoration: none;
    }

    .container .header-button:hover {
      color: #5bb0d4;
    }

    .container .header-button.active {
      color: #549fc0;
      font-weight: bold;
      text-decoration: underline;
      text-underline-offset: 19px; /* Adjust offset value as needed */
      text-decoration-thickness: 2px;
    }


    .container .header-left {
      flex: 1;
      text-align: left;
      font-size: 16px;
      color: #555;
    }

    .container .header-center {
      flex: 1;
      font-size: 16px;
      color: #000;
      text-align: center;
    }

    .container .header-right {
      flex: 1;
      text-align: right;
      font-size: 16px;
      color: #000;
      margin-right: 350px;
    }

    .container-body {
      display: flex;
      height: calc(100% - 50px);
    }

    .container-body .left-content {
      flex: 1;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .container-body .left-content .top-section,
    .container-body .left-content .bottom-section {
      flex: 1;
      position: relative;
      padding: 20px;
      font-size: 16px;
      color: #333;
      overflow: hidden;
      border: none;
    }

    .container-body .left-content .top-section {
      border-bottom: 1px solid #ddd;
    }


    /* Placeholder Text */
    .top-section textarea,
    .bottom-section textarea {
      margin-top: 40px; /* Add space for fixed header */
      width: calc(100% - 20px); /* Account for padding/margin */
      height: calc(100% - 50px); /* Prevent overlap with header */
      border: 1px;
      outline: none;
      padding: 10px;
      font-size: 16px;
      font-family: inherit;
      background: transparent;
      resize: none;
      overflow: auto;
    }

    /* Section title with icon alignment */
    h3 {
    display: flex;
    align-items: center;
    font-size: 16px;
    color: #333;
    }

    .section-icon {
    width: 20px;
    height: 20px;
    margin-right: 8px;
    flex-shrink: 0; /* Prevent the icon from shrinking */
    }
    
    .section-header {
      position: absolute;
      top: 10px; /* Adjust for spacing above the header */
      left: 20px; /* Adjust for alignment with textarea */
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 40px);
      z-index: 1; /* Ensure it stays above textarea */
      padding-right: 10px; /* Space around text to prevent overlapping */
    }

    .right-section-icon {
        width: 20px;
        height: 20px;
        margin-right: 10px;
    }

    /* Upload button with icon alignment */
    .upload-btn {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: #555;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center; /* Ensure icon and text are aligned */
    gap: 5px; /* Space between icon and text */
    }

    .upload-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0; /* Prevent the icon from shrinking */
    margin-left: 10px;
    }

    .analyze-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: #4ba43f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-family: "Montserrat", cursive, sans-serif;
    }

    .analyze-btn:hover {
      background-color: #3f8935;
    }
    table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    }

    th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
    }

    th {
    background-color: #f5f5f5;
    font-weight: bold;
    }

    .container-body .right-content {
      flex: 1;
      display: flex; /* Use flexbox */
      flex-direction: column; /* Arrange content vertically */
      justify-content: flex-start; /* Keep text content at the top */
      align-items: flex-start; /* Align text to the left */
      padding: 20px;
      text-align: left;
      font-size: 16px;
      font-weight: normal;
      color: #333;
      overflow-y: auto;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      position: relative; /* Required for the absolute positioning of loading-container */
  }
    #loading-container {
      display: none; /* Initially hidden */
      position: absolute; /* Positioned relative to the right-content div */
      top: 50%; /* Center vertically */
      left: 50%; /* Center horizontally */
      transform: translate(-50%, -50%); /* Align the center point */
      text-align: center;
      z-index: 1; /* Ensure it's on top of other content */
      width: 100%; /* Optional: Adjust to fit within the parent container */
  }

  </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='rubricai_logo.png') }}" alt="Logo">
            <div class="title">Rubric AI</div>
        </div>
        <div class="header-buttons">
            {% if session['user_email'] %}
                <a href="/user_editor" class="header-button">Editor</a>
                <a href="/account" class="header-button">Account</a>
            {% else %}
                <a href="/login" class="header-button">Login</a>
                <a href="/signup" class="header-button">Sign Up</a>
            {% endif %}
        </div>
    </header>    
    

  <div style="display: flex; flex-direction: column; align-items: center; width: 1500px; max-width: 1500px; padding: 0; margin-top: 100px; line-height: 1.6;">
      <!-- Description -->
      <div style="text-align: center; margin-bottom: 30px; margin-top: 50px; font-family: 'Montserrat', sans-serif; width: 70%;">
          <h1 style="font-size: 28px; margin: 0; font-weight: 700;">Elevate your grades effortlessly with Rubric AI</h1>
      </div>

      <div class="container" style="margin: 0 auto;">
          <div class="container-header">
              <div class="header-left"><strong>Modes:</strong></div>
              <div class="header-center">
                  <button class="header-button" id="feedback-button">Feedback</button>
              </div>
              <div class="header-right">
                  <button class="header-button" id="perfect-score-button">Score Booster</button>
              </div>
          </div>

          <div class="container-body">
              <div class="left-content">
                  <div class="top-section">
                      <div class="section-header">
                          <h3>
                              <img src="{{ url_for('static', filename='yourwork_icon.png') }}" alt="Your Work Icon"
                                  class="section-icon">
                              Your Work
                          </h3>
                          <div id="assignment-section-icon" class="section-header-icon" style="display: none;">
                            <img src="{{ url_for('static', filename='delete_icon.png') }}" alt="Additional Icon" class="right-section-icon">
                          </div>
                      </div>
                      <textarea id="assignment-input"
                          placeholder="Paste or type your assignment here..."
                          oninput="toggleUploadButton('assignment')"></textarea>
                      <span class="upload-btn" id="assignment-upload-btn"
                          onclick="document.getElementById('assignment-upload').click();">
                          <img src="{{ url_for('static', filename='uploadfile_icon.png') }}" alt="Upload Icon"
                              class="upload-icon"> Upload File
                      </span>
                      <input type="file" id="assignment-upload" style="display: none;"
                          onchange="uploadFile('assignment')">
                  </div>
                  <div class="bottom-section">
                      <div class="section-header">
                          <h3>
                              <img src="{{ url_for('static', filename='rubric_icon.png') }}" alt="Rubric Icon"
                                  class="section-icon">
                              Rubric
                          </h3>
                          <div id="rubric-section-icon" class="section-header-icon" style="display: none;">
                            <img src="{{ url_for('static', filename='delete_icon.png') }}" alt="Additional Icon" class="right-section-icon">
                          </div>
                      </div>
                      <textarea id="rubric-input" placeholder="Paste or type the rubric here..."
                          oninput="toggleUploadButton('rubric')"></textarea>
                      <span class="upload-btn" id="rubric-upload-btn"
                          onclick="document.getElementById('rubric-upload').click();">
                          <img src="{{ url_for('static', filename='uploadfile_icon.png') }}" alt="Upload Icon"
                              class="upload-icon"> Upload File
                      </span>
                      <input type="file" id="rubric-upload" style="display: none;"
                          onchange="uploadFile('rubric')">
                      <button class="analyze-btn" onclick="analyzeContent()">Analyze</button>
                  </div>
              </div>
              
              <!-- Output Section -->
              <div class="right-content" id="output-section">
                  <!-- Loading Container -->
                  <div id="loading-container"
                      style="display: none; text-align: center; margin: 20px 0;">
                      <div class="loading-bar"
                          style="width: 80%; height: 20px; background: #e0e0e0; border-radius: 10px; margin: 0 auto; overflow: hidden;">
                          <div id="progress-bar"
                              style="width: 0%; height: 100%; background: #4caf50; transition: width 0.3s ease;"></div>
                      </div>
                      <p id="loading-text"
                          style="margin-top: 10px; font-size: 1rem; color: #333;">Analyzing... 0%</p>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        © 2024 rubric.ai. All rights reserved.
      </div>
      <div class="footer-right">
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
      </div>
    </div>
  </footer>
    
    

    <script>
      // Variables to store outputs for each mode
      let feedbackOutput = ""; // Store Feedback mode output
      let perfectScoreOutput = ""; // Store Perfect Score mode output

      async function analyzeContent() {
          console.log("Analyze button clicked"); // Debug log
          const assignment = document.getElementById('assignment-input').value;
          const rubric = document.getElementById('rubric-input').value;

          if (!assignment || !rubric) {
              alert("Please fill in both the assignment and rubric fields.");
              console.warn("Missing assignment or rubric input"); // Debug log
              return;
          }

          const outputSection = document.getElementById('output-section');
          const loadingContainer = ensureLoadingContainer();
          const progressBar = document.getElementById('progress-bar');
          const loadingText = document.getElementById('loading-text');

          if (!loadingContainer || !progressBar || !loadingText) {
              console.error("Loading container elements not found in the DOM!");
              return;
          }

          // Clear all output except the loading container
          Array.from(outputSection.children).forEach((child) => {
              if (child.id !== 'loading-container') {
                  child.remove();
              }
          });

          // Reset and show loading bar
          loadingContainer.style.display = 'block';
          progressBar.style.width = '0%';
          loadingText.textContent = 'Analyzing... 0%';

          let progress = 0;
          const interval = setInterval(() => {
              if (progress < 90) {
                  progress += 10;
                  progressBar.style.width = `${progress}%`;
                  loadingText.textContent = `Analyzing... ${progress}%`;
              } else {
                  clearInterval(interval);
              }
          }, 300); // Update every 300ms

          try {
              const response = await fetch('/analyze', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ assignment, rubric, mode: currentMode }),
              });

              const result = await response.json();

              progressBar.style.width = '100%';
              loadingText.textContent = 'Complete! 100%';
              setTimeout(() => {
                  loadingContainer.style.display = 'none';
              }, 1000);

              if (result.error) {
                  console.error("Error received from server:", result.error); // Debug log
                  const errorOutput = document.createElement('p');
                  errorOutput.textContent = `Error: ${result.error}`;
                  outputSection.appendChild(errorOutput);

                  // Save the error output for the current mode
                  if (currentMode === 'Feedback') {
                      feedbackOutput = `<p>Error: ${result.error}</p>`;
                  } else {
                      perfectScoreOutput = `<p>Error: ${result.error}</p>`;
                  }
              } else {
                  console.log("Analysis result received:", result); // Debug log
                  const resultOutput = document.createElement('div');
                  resultOutput.innerHTML = result.output;
                  outputSection.appendChild(resultOutput);

                  // Save the result output for the current mode
                  if (currentMode === 'Feedback') {
                      feedbackOutput = result.output;
                  } else {
                      perfectScoreOutput = result.output;
                  }
              }
          } catch (error) {
              console.error("Error during analysis:", error); // Debug log
              const errorOutput = document.createElement('p');
              errorOutput.textContent = "An error occurred during analysis.";
              outputSection.appendChild(errorOutput);

              // Save the error output for the current mode
              if (currentMode === 'Feedback') {
                  feedbackOutput = "<p>An error occurred during analysis.</p>";
              } else {
                  perfectScoreOutput = "<p>An error occurred during analysis.</p>";
              }
          } finally {
              clearInterval(interval);
              setTimeout(() => {
                  loadingContainer.style.display = 'none';
              }, 500);
          }
      }

      function switchMode(mode) {
          console.log(`Switching to ${mode} mode`); // Debug log
          currentMode = mode;
          const outputSection = document.getElementById('output-section');

          // Clear current content but keep the loading container
          Array.from(outputSection.children).forEach((child) => {
              if (child.id !== 'loading-container') {
                  child.remove();
              }
          });

          // Restore the saved output for the current mode
          const restoredOutput = currentMode === 'Feedback' ? feedbackOutput : perfectScoreOutput;
          if (restoredOutput) {
              const resultOutput = document.createElement('div');
              resultOutput.innerHTML = restoredOutput;
              outputSection.appendChild(resultOutput);
          }

          // Update button styles to indicate active mode
          document.getElementById('feedback-button').classList.toggle('active', mode === 'Feedback');
          document.getElementById('perfect-score-button').classList.toggle('active', mode === 'Perfect Score');
      }


      function ensureLoadingContainer() {
        const outputSection = document.getElementById('output-section');

        if (!outputSection) {
            console.error("Output section not found in the DOM!");
            return;
        }

        let loadingContainer = document.getElementById('loading-container');

        // If the loading container doesn't exist, create it
        if (!loadingContainer) {
            loadingContainer = document.createElement('div');
            loadingContainer.id = 'loading-container';
            loadingContainer.style.display = 'none'; // Hidden initially
            loadingContainer.style.textAlign = 'center';

            const progressBarContainer = document.createElement('div');
            progressBarContainer.className = 'loading-bar';
            progressBarContainer.style.width = '80%';
            progressBarContainer.style.height = '20px';
            progressBarContainer.style.background = '#e0e0e0';
            progressBarContainer.style.borderRadius = '10px';
            progressBarContainer.style.margin = '0 auto';
            progressBarContainer.style.overflow = 'hidden';

            const progressBar = document.createElement('div');
            progressBar.id = 'progress-bar';
            progressBar.style.width = '0%';
            progressBar.style.height = '100%';
            progressBar.style.background = '#4caf50';
            progressBar.style.transition = 'width 0.3s ease';

            progressBarContainer.appendChild(progressBar);

            const loadingText = document.createElement('p');
            loadingText.id = 'loading-text';
            loadingText.style.marginTop = '10px';
            loadingText.style.fontSize = '1rem';
            loadingText.style.color = '#333';
            loadingText.textContent = 'Analyzing... 0%';

            loadingContainer.appendChild(progressBarContainer);
            loadingContainer.appendChild(loadingText);

            outputSection.appendChild(loadingContainer);
        }

        return loadingContainer;
    }

      // Initialize default output
      document.addEventListener('DOMContentLoaded', () => {
          console.log("Page loaded. Default mode is Feedback"); // Debug log
          switchMode('Feedback'); // Default mode
      });

      // Add event listeners to mode buttons
      document.getElementById('feedback-button').addEventListener('click', () => {
          console.log("Feedback button clicked"); // Debug log
          switchMode('Feedback');
      });
      document.getElementById('perfect-score-button').addEventListener('click', () => {
          console.log("Perfect Score button clicked"); // Debug log
          switchMode('Perfect Score');
      });


      function toggleUploadButton(field) {
          const textarea = document.getElementById(`${field}-input`);
          const uploadBtn = document.getElementById(`${field}-upload-btn`);
          
          // Hide the upload button if there is input in the textarea, otherwise show it
          if (textarea.value.trim()) {
              console.log(`${field} input detected. Hiding upload button`); // Debug log
              uploadBtn.style.display = 'none';
          } else {
              console.log(`${field} input empty. Showing upload button`); // Debug log
              uploadBtn.style.display = 'flex'; // Reset to flex for proper alignment
          }
      }

      async function uploadFile(type) {
          const fileInput = type === 'assignment' ? document.getElementById('assignment-upload') : document.getElementById('rubric-upload');
          const textarea = type === 'assignment' ? document.getElementById('assignment-input') : document.getElementById('rubric-input');

          const file = fileInput.files[0];
          if (!file) {
              alert("Please select a file to upload.");
              console.warn(`No file selected for ${type} upload`); // Debug log
              return;
          }

          const formData = new FormData();
          formData.append("file", file);

          try {
              const response = await fetch('/upload', {
                  method: 'POST',
                  body: formData,
              });

              const result = await response.json();
              if (result.error) {
                  console.error("File upload error:", result.error); // Debug log
                  alert(`Error: ${result.error}`);
              } else {
                  console.log(`File uploaded successfully for ${type}`); // Debug log
                  textarea.value = result.text;
                  toggleUploadButton(type); // Trigger the toggle logic after adding input
              }
          } catch (error) {
              console.error("Error during file upload:", error); // Debug log
              alert("An error occurred during file upload.");
          }
      }

      function clearInput(section) {
          if (section === 'assignment') {
              const assignmentInput = document.getElementById('assignment-input');
              assignmentInput.value = '';
              toggleUploadButton('assignment');
              toggleSectionIcons();
          } else if (section === 'rubric') {
              const rubricInput = document.getElementById('rubric-input');
              rubricInput.value = '';
              toggleUploadButton('rubric');
              toggleSectionIcons();
          }
      }

      function toggleSectionIcons() {
          const assignmentInput = document.getElementById('assignment-input');
          const rubricInput = document.getElementById('rubric-input');
          
          const assignmentSectionIcon = document.getElementById('assignment-section-icon');
          const rubricSectionIcon = document.getElementById('rubric-section-icon');
          
          if (assignmentInput.value.trim()) {
              if (assignmentSectionIcon) {
                  assignmentSectionIcon.style.display = 'flex';
              }
          } else {
              if (assignmentSectionIcon) {
                  assignmentSectionIcon.style.display = 'none';
              }
          }
          
          if (rubricInput.value.trim()) {
              if (rubricSectionIcon) {
                  rubricSectionIcon.style.display = 'flex';
              }
          } else {
              if (rubricSectionIcon) {
                  rubricSectionIcon.style.display = 'none';
              }
          }
      }

      // Update the HTML for the section headers to include onclick event
      document.addEventListener('DOMContentLoaded', () => {
          const assignmentSectionIcon = document.getElementById('assignment-section-icon');
          const rubricSectionIcon = document.getElementById('rubric-section-icon');
          
          if (assignmentSectionIcon) {
              assignmentSectionIcon.innerHTML = `
                  <img src="{{ url_for('static', filename='delete_icon.png') }}" 
                      alt="Clear Assignment" 
                      class="right-section-icon" 
                      onclick="clearInput('assignment')">
              `;
          }
          
          if (rubricSectionIcon) {
              rubricSectionIcon.innerHTML = `
                  <img src="{{ url_for('static', filename='delete_icon.png') }}" 
                      alt="Clear Rubric" 
                      class="right-section-icon" 
                      onclick="clearInput('rubric')">
              `;
          }

          // Add event listeners for input tracking
          document.getElementById('assignment-input').addEventListener('input', toggleSectionIcons);
          document.getElementById('rubric-input').addEventListener('input', toggleSectionIcons);

          // Initial call to set the correct state on page load
          toggleSectionIcons();
      });

      // Update the existing CSS to make the delete icon look clickable
      const style = document.createElement('style');
      style.textContent = `
          .right-section-icon {
              width: 20px;
              height: 20px;
              cursor: pointer;
              opacity: 0.6;
              transition: opacity 0.3s ease;
          }
          .right-section-icon:hover {
              opacity: 1;
          }
      `;
      document.head.appendChild(style);
  </script>
</body>
</html>
