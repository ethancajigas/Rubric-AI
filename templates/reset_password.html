<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f7f7;
      min-height: 100vh;
      flex-direction: column;
    }

    .fp-container {  
      flex: 1;
      width: 100%;
      max-width: 400px;
      background-color: transparent;
      padding-top: 12%;
      padding-bottom: 12%;
      border-radius: 8px;
      text-align: center;
      font-family: 'Montserrat', 'sans-serif';
      margin: 100px auto 0;
    }

    .fp-container h1 {
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 25px;
      margin-right: 25px;
    }

    .form-group label {
      display: block;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .form-group input {
      width: 100%;
      padding: 20px 12px;
      font-size: 17px;
      border: 1px solid #000000;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .fp-button {
      width: 100%;
      padding: 20px 12px;
      background-color: #5bb0d4;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 15px;
    }

    .fp-button:hover {
      background-color: #53a3c5;
    }

/* Add these responsive styles */
@media screen and (max-width: 768px) {
    .fp-container {
        width: 90%;
        max-width: none;
        padding: 20px; /* Adjust padding for better spacing */
        margin-top: 20%;
    }

    .fp-container h1 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center; /* Keep heading centered */
    }

    .form-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* Align form elements to the left */
        width: 100%;
        margin-bottom: 20px;
    }

    .form-group label {
        font-size: 16px;
        text-align: left;
    }

    .form-group input {
        font-size: 16px;
        padding: 15px 10px;
        width: 100%; /* Make inputs responsive */
        box-sizing: border-box;
    }

    .fp-button {
        font-size: 15px;
        padding: 15px 10px;
        width: 100%;
        margin-top: 20px;
    }

    /* Optional: Input focus styles */
    .form-group input:focus {
        outline: 2px solid #5bb0d4;
        outline-offset: -2px;
    }
}



  </style>
</head>
<body>
  <div class="fp-container">
    <h1>Enter your new password</h1>
    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required>
      </div>
      <button type="submit" class="fp-button">Reset Password</button>
    </form>
  </div>  
</body>
</html>
