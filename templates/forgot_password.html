<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f7f7;
      min-height: 100vh;
      flex-direction: column;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between; /* This will push logo to left, buttons to right */
        background-color: #383838;
        padding: 10px 20px;
        border-bottom: 2px solid #ddd;
        width: 100%;
        position: fixed;
        z-index: 1000;
        top: 0;
    }

    .header .header-buttons {
        display: flex;
        align-items: center;
        gap: 20px; /* Space between buttons */
        margin-right: 7%;
        position: static;
        right: auto;
    }

    .header .header-button {
        background-color: transparent;
        border: none;
        cursor: pointer;
        padding: 5px 10px;
        transition: color 0.5s ease;
        font-family: "Montserrat", sans-serif;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .header .header-button:hover {
        color: #5bb0d4;
    }

    .header .logo-container {
      display: flex;
      align-items: center;
      margin-left: 7%;
    }

    .header .logo-container img {
      height: 60px;
      margin-right: 5px;
    }

    .header .logo-container .title {
      font-family: "Montserrat", cursive, sans-serif;
      font-size: 24px;
      color: #ffffff;
    }

    .footer {
      background-color: #383838;
      color: #ffffff;
      padding: 20px 0; /* Top and bottom padding, no horizontal padding */
      width: 100vw; /* Full viewport width */
      position: relative;
      bottom: 0;
      left: 0;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px; /* Keeps the content centered within the footer */
      margin: 0 auto; /* Centers the content horizontally */
      padding: 0 20px; /* Optional: Adds spacing inside the content */
    }

    .footer-left {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
    }

    .footer-right {
      display: flex;
      gap: 20px;
    }

    .footer-right a {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.5s ease;
    }

    .footer-right a:hover {
      color: #5bb0d4;
    }

    .fp-container {  
      flex: 1;
      width: 100%;
      max-width: 400px;
      background-color: transparent;
      padding-top: 12%;
      padding-bottom: 12%;
      border-radius: 8px;
      text-align: center;
      font-family: 'Montserrat', 'sans-serif';
      margin: 100px auto 0;
    }

    .fp-container h1 {
      font-size: 35px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 25px;
      margin-right: 25px;
    }

    .form-group label {
      display: block;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .form-group input {
      width: 100%;
      padding: 20px 12px;
      font-size: 17px;
      border: 1px solid #000000;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .fp-button {
      width: 100%;
      padding: 20px 12px;
      background-color: #5bb0d4;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 15px;
    }

    .fp-button:hover {
      background-color: #53a3c5;
    }

    .fp-footer {
      margin-top: 15px;
      font-size: 14px;
    }

    .fp-footer a {
      color: #000000;
      text-decoration: none;
      font-weight: 600;
    }

    .fp-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='rubricai_logo.png') }}" alt="Logo">
            <div class="title">Rubric AI</div>
        </div>
        <div class="header-buttons">
            <a href="/editor" class="header-button">Editor</a>
            <a href="/login" class="header-button">Login</a>
            <a href="/signup" class="header-button">Sign Up</a>
        </div>
    </header>

  <div class="fp-container">
    <h1>Forgot Password</h1>
    <form action="/forgot_password" method="POST">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>     
        <button type="submit" class="fp-button">Send Link</button>
      </form>      
    <div class="fp-footer">
      Don't have an account? <a href="/signup"><strong>Sign Up</strong></a>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        © 2024 rubric.ai. All rights reserved.
      </div>
      <div class="footer-right">
        <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
      </div>
    </div>
  </footer>

</body>
</html>
